<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS Link</title><link rel="stylesheet" href="home.css"><link rel="stylesheet" href="chat.css"><link rel="stylesheet" href="chat-layout.css"><script src="palette-data.js"></script><script src="theme.js" defer></script><script src="chat.js" defer></script></head><body><main><header><div class="mark">J</div><div><span class="eyebrow">JARVIS LINK</span><h1>本机轻量聊天</h1><p>Qwen2.5 0.5B · CPU · 离线运行</p></div><div class="appearance"><select id="palette" aria-label="配色"></select><button id="theme-toggle" class="theme-button">深色</button></div></header><section id="chat"><div class="bar"><span>模型与消息在本机处理</span><button id="new-chat" class="secondary" type="button">新对话</button></div><div id="messages" role="log" aria-live="polite"><p id="empty">聊点什么？小模型适合中文短对话。</p></div><form id="chat-form"><label for="prompt">消息</label><textarea id="prompt" rows="3" maxlength="4000" required placeholder="输入消息，Ctrl + Enter 发送"></textarea><div class="actions"><span id="progress"></span><button id="stop" class="secondary" type="button" hidden>停止</button><button id="send">发送</button></div></form><p class="note">无需外网，也不访问开发版的记忆和文件。当前提供文字聊天，关闭页面后不保留会话。</p></section><p id="error" role="alert" hidden></p><footer>JARVIS Link</footer></main></body></html>
